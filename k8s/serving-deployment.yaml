apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-serving
  namespace: ml-training
  labels:
    app: ml-serving
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ml-serving
  template:
    metadata:
      labels:
        app: ml-serving
    spec:
      containers:
        - name: serving
          image: mlops-serve:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_CHECKPOINT_PATH
              value: /app/checkpoints/model.pt
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1"
              memory: "2Gi"
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: training-pvc
            readOnly: true
